<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guess the Number — 2-Player Number Guessing Game</title>
<meta name="description" content="A fun 2-player number guessing game (1–100). One player picks, the other guesses with limited chances. Track scores, see distance highlights. No install needed — plays in your browser.">
<meta name="theme-color" content="#1a1a2e">
<meta property="og:title" content="Guess the Number — 2-Player Game">
<meta property="og:description" content="Pick a number, guess it right! A fast 2-player guessing game with score tracking. Runs entirely in your browser.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Guess the Number — 2-Player Game">
<meta name="twitter:description" content="Pick a number, guess it right! A fast 2-player guessing game with score tracking.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 16px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 1.8rem; color: #e0e0ff; }

  .scoreboard {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .player {
    text-align: center; padding: 8px 20px; border-radius: 10px;
    background: #16213e; min-width: 130px;
  }
  .player.picker { outline: 3px solid #2d6a4f; }
  .player.guesser { outline: 3px solid #ffd166; }
  .player .role { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
  .player.picker .role { color: #2d6a4f; }
  .player.guesser .role { color: #ffd166; }
  .player .name-input {
    background: transparent; border: none; border-bottom: 1px solid #444;
    color: #e0e0ff; font-size: 1.1rem; text-align: center; width: 110px; outline: none;
    font-weight: 600;
  }
  .player .score { font-size: 2rem; font-weight: 900; color: #fff; }

  .topbar {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .topbar label { font-size: 1rem; color: #aab; }
  .topbar input[type="number"] {
    width: 50px; padding: 6px; border-radius: 6px; border: 1px solid #444;
    background: #16213e; color: #eee; font-size: 1.1rem; text-align: center;
  }
  .topbar button {
    padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 1rem; font-weight: 700;
  }
  .topbar button:active { transform: scale(0.96); }
  .topbar button:hover { filter: brightness(1.15); }
  #resetBtn { background: #444; color: #ddd; }
  #nextRoundBtn { background: #0f3460; color: #eee; font-size: 1.1rem; padding: 10px 24px; }

  .info {
    text-align: center; margin-bottom: 6px; font-size: 1.05rem; color: #99a;
  }
  .info span { font-weight: 800; color: #fff; }

  .prompt {
    text-align: center; margin-bottom: 8px; font-size: 1.15rem; color: #bbc; min-height: 1.4em;
    font-weight: 600;
  }

  .reveal-bar {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    flex-wrap: wrap; margin-bottom: 10px;
  }
  .reveal-bar label { font-size: 1.1rem; color: #aab; }
  .reveal-bar input[type="number"] {
    width: 70px; padding: 8px 10px; border-radius: 8px; border: 2px solid #ffd166;
    background: #16213e; color: #ffd166; font-size: 1.4rem; text-align: center; font-weight: 700;
  }
  .reveal-bar button {
    padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 1.1rem; font-weight: 700; background: #2d6a4f; color: #eee;
  }
  .reveal-bar button:hover { filter: brightness(1.15); }

  .points-display {
    text-align: center; margin-bottom: 10px; font-size: 1.2rem; font-weight: 700; line-height: 1.6;
  }
  .points-display .pts { color: #ffd166; font-size: 1.6rem; }
  .points-display .zero { color: #2d6a4f; font-size: 1.6rem; }

  .game-area {
    display: flex; gap: 14px; max-width: 880px; margin: 0 auto;
    align-items: flex-start; justify-content: center; flex-wrap: wrap;
  }

  .feedback-col {
    display: flex; flex-direction: column; gap: 8px; width: 80px; padding-top: 10px;
  }
  .fb-btn {
    padding: 12px 6px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 0.95rem; font-weight: 800; text-align: center; width: 100%;
    transition: opacity 0.15s;
  }
  .fb-btn:active { transform: scale(0.95); }
  .fb-btn:hover:not(:disabled) { filter: brightness(1.15); }
  .fb-btn:disabled { cursor: default; }
  .fb-btn.up { background: #2d6a4f; color: #eee; }
  .fb-btn.ok { background: #b08c1a; color: #1a1a2e; }
  .fb-btn.dn { background: #9b2226; color: #eee; }
  .fb-btn.inactive { opacity: 0.2; }
  .fb-btn.active { opacity: 1; }
  .guess-chip {
    text-align: center; font-size: 1.4rem; font-weight: 900; color: #ffd166;
    background: #16213e; border-radius: 8px; padding: 8px 0; min-height: 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .guess-chip.empty { color: #334; }

  .grid-col { flex: 1; min-width: 300px; max-width: 520px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
  }
  .cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    font-size: 1.05rem; font-weight: 800;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }
  .cell.eligible { background: #0f3460; color: #e0e0ff; cursor: pointer; }
  .cell.eligible:hover { background: #1a5276; }
  .cell.selected { background: #ffd166; color: #1a1a2e; cursor: pointer; }
  .cell.eliminated { background: #2a2a3a; color: #555; }
  .cell.guessed { background: #9b2226; color: #888; }
  .cell.correct { background: #2d6a4f; color: #fff; animation: pulse 0.6s ease 2; }
  .cell.answer { background: #2d6a4f; color: #fff; }
  .cell.distance { background: #e76f51; color: #fff; }
  .cell.closest { background: #f4a261; color: #1a1a2e; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .score-col { width: 200px; min-width: 180px; }
  .sidebar-title {
    font-size: 0.85rem; color: #99a; text-transform: uppercase; letter-spacing: 1.5px;
    margin-bottom: 6px; text-align: center; font-weight: 700;
  }
  .score-table {
    width: 100%; border-collapse: collapse; font-size: 0.9rem;
    background: #16213e; border-radius: 10px; overflow: hidden;
  }
  .score-table th {
    padding: 7px 4px; background: #0f3460; color: #bbc;
    font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .score-table td {
    padding: 5px 4px; text-align: center; border-bottom: 1px solid #1a1a2e; color: #dde;
  }
  .score-table tr:last-child td { border-bottom: none; }
  .score-table .rn { color: #889; font-weight: 600; }
  .score-table .pk { color: #e76f51; font-weight: 800; font-size: 1rem; }
  .score-table .zr { color: #4a9; font-weight: 700; }
  .score-table .cum { color: #ffd166; font-weight: 800; font-size: 0.95rem; }
  .score-table .total-row { background: #0f3460; }
  .score-table .total-row td { font-weight: 900; font-size: 1.1rem; color: #ffd166; border: none; }
  .no-rounds { text-align: center; color: #667; font-size: 0.9rem; padding: 20px 0; }

  .log {
    max-width: 520px; margin: 10px auto 0;
    background: #16213e; border-radius: 8px; padding: 8px 12px;
    font-size: 0.85rem; max-height: 90px; overflow-y: auto;
  }
  .log p { padding: 3px 0; border-bottom: 1px solid #1a1a2e; }
  .log p:last-child { border: none; }

  .hidden { display: none !important; }

  @media (max-width: 700px) {
    .game-area { flex-direction: column; align-items: center; }
    .feedback-col { flex-direction: row; width: auto; padding-top: 0; }
    .fb-btn { width: auto; padding: 10px 18px; }
    .guess-chip { padding: 8px 14px; min-height: auto; }
    .score-col { width: 100%; max-width: 520px; }
  }
</style>
</head>
<body>

<h1>Guess the Number (1–100)</h1>

<div class="scoreboard">
  <div class="player picker" id="p1box">
    <div class="role" id="p1role">Picker</div>
    <div><input class="name-input" id="p1name" value="Player 1" maxlength="12"></div>
    <div class="score" id="p1score">0</div>
  </div>
  <div class="player guesser" id="p2box">
    <div class="role" id="p2role">Guesser</div>
    <div><input class="name-input" id="p2name" value="Player 2" maxlength="12"></div>
    <div class="score" id="p2score">0</div>
  </div>
</div>

<div class="info">
  Round <span id="roundNum">1</span>
  &nbsp;|&nbsp; Chances: <span id="chancesLeft">5</span> / <span id="totalChances">5</span>
  &nbsp;|&nbsp; Eligible: <span id="eligibleCount">100</span>
</div>

<div class="prompt" id="prompt">Player 2: Tap a number to guess</div>

<div class="reveal-bar hidden" id="revealBar">
  <label>Correct number:</label>
  <input type="number" id="revealInput" min="1" max="100" placeholder="?" aria-label="correct number">
  <button onclick="revealAnswer()">Reveal</button>
</div>

<div class="points-display hidden" id="pointsDisplay"></div>

<div class="game-area">
  <div class="feedback-col">
    <div class="guess-chip empty" id="guessChip">—</div>
    <button class="fb-btn up inactive" id="upBtn" disabled onclick="giveFeedback('up')">&#x2B06;<br>Higher</button>
    <button class="fb-btn ok inactive" id="correctBtn" disabled onclick="giveFeedback('correct')">&#x2713;<br>Correct</button>
    <button class="fb-btn dn inactive" id="downBtn" disabled onclick="giveFeedback('down')">&#x2B07;<br>Lower</button>
  </div>

  <div class="grid-col">
    <div class="grid" id="grid"></div>
  </div>

  <div class="score-col">
    <div class="sidebar-title">Score History</div>
    <div id="scoreHistory"><div class="no-rounds">No rounds yet</div></div>
  </div>
</div>

<div class="topbar">
  <label>Chances:</label>
  <input type="number" id="chancesInput" min="1" max="20" value="5" onchange="updateChances()">
  <button id="resetBtn" onclick="resetGame()">Reset</button>
  <button id="nextRoundBtn" class="hidden" onclick="nextRound()">Next Round &#x27A1;</button>
</div>

<div class="log" id="log"></div>

<script>
  const KEY = 'guess_the_number_state';

  let S = {
    maxChances: 5, chancesUsed: 0, lo: 1, hi: 100,
    currentGuess: null, gameOver: false, guesses: [], roundOver: false,
    scores: [0, 0], round: 1, pickerIdx: 0, guesserIdx: 1,
    history: [], names: ['Player 1', 'Player 2'],
    cells: Array(100).fill('eligible')
  };

  const grid = document.getElementById('grid');
  const log = document.getElementById('log');
  const prompt = document.getElementById('prompt');

  function nm(i) { return S.names[i]; }

  function save() {
    S.names = [document.getElementById('p1name').value, document.getElementById('p2name').value];
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  }

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.scores) S = d;
    } catch(e) {}
  }

  function setFbActive(on) {
    ['upBtn','correctBtn','downBtn'].forEach(id => {
      const b = document.getElementById(id);
      b.disabled = !on;
      b.classList.toggle('inactive', !on);
      b.classList.toggle('active', on);
    });
    const chip = document.getElementById('guessChip');
    if (on && S.currentGuess) {
      chip.textContent = S.currentGuess;
      chip.classList.remove('empty');
    } else {
      chip.textContent = '—';
      chip.classList.add('empty');
    }
  }

  function updateScoreboard() {
    document.getElementById('p1score').textContent = S.scores[0];
    document.getElementById('p2score').textContent = S.scores[1];
    document.getElementById('p1box').className = 'player ' + (S.pickerIdx === 0 ? 'picker' : 'guesser');
    document.getElementById('p2box').className = 'player ' + (S.pickerIdx === 1 ? 'picker' : 'guesser');
    document.getElementById('p1role').textContent = S.pickerIdx === 0 ? 'Picker' : 'Guesser';
    document.getElementById('p2role').textContent = S.pickerIdx === 1 ? 'Picker' : 'Guesser';
  }

  function renderHistory() {
    const el = document.getElementById('scoreHistory');
    if (!S.history.length) { el.innerHTML = '<div class="no-rounds">No rounds yet</div>'; return; }
    let h = '<table class="score-table"><thead><tr><th>R</th><th>' + nm(0) + '</th><th>' + nm(1) + '</th></tr></thead><tbody>';
    for (const r of S.history) {
      const p1 = r.pickerIdx === 0 ? r.pts : 0;
      const p2 = r.pickerIdx === 1 ? r.pts : 0;
      h += '<tr><td class="rn">' + r.round + '</td>'
        + '<td class="' + (p1 ? 'pk' : 'zr') + '">' + (p1 ? '+' + p1 : '0') + '</td>'
        + '<td class="' + (p2 ? 'pk' : 'zr') + '">' + (p2 ? '+' + p2 : '0') + '</td></tr>'
        + '<tr><td></td><td class="cum">' + r.scores[0] + '</td><td class="cum">' + r.scores[1] + '</td></tr>';
    }
    h += '</tbody><tfoot><tr class="total-row"><td>Total</td><td>' + S.scores[0] + '</td><td>' + S.scores[1] + '</td></tr></tfoot></table>';
    el.innerHTML = h;
  }

  function buildGrid() {
    grid.innerHTML = '';
    for (let i = 1; i <= 100; i++) {
      const d = document.createElement('div');
      d.className = 'cell ' + S.cells[i - 1];
      d.textContent = i;
      d.id = 'c' + i;
      d.onclick = () => pickNumber(i);
      grid.appendChild(d);
    }
  }

  function setCellClass(i, cls) {
    S.cells[i - 1] = cls;
    document.getElementById('c' + i).className = 'cell ' + cls;
  }

  function pickNumber(num) {
    if (S.gameOver || S.roundOver) return;
    if (S.cells[num - 1] !== 'eligible' && S.cells[num - 1] !== 'selected') return;

    if (S.currentGuess && S.currentGuess !== num) {
      setCellClass(S.currentGuess, 'eligible');
    }
    if (S.currentGuess === num) {
      setCellClass(num, 'eligible');
      S.currentGuess = null;
      setFbActive(false);
      prompt.textContent = nm(S.guesserIdx) + ': Tap a number to guess';
      save();
      return;
    }

    S.currentGuess = num;
    setCellClass(num, 'selected');
    setFbActive(true);
    prompt.textContent = nm(S.pickerIdx) + ': Is ' + num + ' correct, higher, or lower?';
    save();
  }

  function updateChances() {
    S.maxChances = Math.max(1, Math.min(20, +document.getElementById('chancesInput').value || 5));
    document.getElementById('totalChances').textContent = S.maxChances;
    document.getElementById('chancesLeft').textContent = S.maxChances - S.chancesUsed;
    save();
  }

  function updateInfo() {
    document.getElementById('chancesLeft').textContent = S.maxChances - S.chancesUsed;
    document.getElementById('totalChances').textContent = S.maxChances;
    document.getElementById('roundNum').textContent = S.round;
    document.getElementById('chancesInput').value = S.maxChances;
    let eligible = S.cells.filter(c => c === 'eligible' || c === 'selected').length;
    document.getElementById('eligibleCount').textContent = eligible;
  }

  function addLog(msg) {
    const p = document.createElement('p');
    p.textContent = msg;
    log.prepend(p);
  }

  function highlightDistance(closest, answer) {
    const from = Math.min(closest, answer);
    const to = Math.max(closest, answer);
    for (let i = from; i <= to; i++) {
      if (i === answer) setCellClass(i, 'answer');
      else if (i === closest) setCellClass(i, 'closest');
      else setCellClass(i, 'distance');
    }
  }

  function endRound(pts, msg) {
    S.scores[S.pickerIdx] += pts;
    S.history.push({ round: S.round, pickerIdx: S.pickerIdx, pts: pts, scores: [S.scores[0], S.scores[1]] });
    S.roundOver = true;
    S.gameOver = true;
    updateScoreboard();
    renderHistory();
    setFbActive(false);
    document.getElementById('pointsDisplay').classList.remove('hidden');
    document.getElementById('pointsDisplay').innerHTML = msg;
    prompt.textContent = 'Round over! Press Next Round.';
    document.getElementById('nextRoundBtn').classList.remove('hidden');
    save();
  }

  function showReveal() {
    S.gameOver = true;
    setFbActive(false);
    document.getElementById('revealBar').classList.remove('hidden');
    prompt.textContent = nm(S.pickerIdx) + ': Enter the correct number';
    document.getElementById('revealInput').focus();
    save();
  }

  function revealAnswer() {
    const val = +document.getElementById('revealInput').value;
    if (!val || val < 1 || val > 100) return;
    document.getElementById('revealBar').classList.add('hidden');

    const lastGuess = S.guesses[S.guesses.length - 1];
    const dist = Math.abs(lastGuess - val);

    highlightDistance(lastGuess, val);
    addLog('R' + S.round + ': Answer=' + val + ' Last guess=' + lastGuess + ' Dist=' + dist + ' → ' + nm(S.pickerIdx) + ' +' + dist);

    endRound(dist,
      'Answer: <strong>' + val + '</strong> &nbsp;|&nbsp; Last guess: <strong>' + lastGuess
      + '</strong> &nbsp;|&nbsp; Distance: <strong>' + dist
      + '</strong><br>' + nm(S.pickerIdx) + ' scores <span class="pts">+' + dist + ' pts</span>');
  }

  function giveFeedback(fb) {
    if (!S.currentGuess || S.gameOver) return;

    S.chancesUsed++;
    S.guesses.push(S.currentGuess);

    if (fb === 'correct') {
      setCellClass(S.currentGuess, 'correct');
      for (let i = 1; i <= 100; i++) {
        if (i !== S.currentGuess && S.cells[i - 1] === 'eligible') setCellClass(i, 'eliminated');
      }
      addLog('R' + S.round + ': ' + S.currentGuess + ' Correct! ' + nm(S.pickerIdx) + ' +0');
      endRound(0,
        nm(S.guesserIdx) + ' nailed it in ' + S.chancesUsed
        + ' guess' + (S.chancesUsed > 1 ? 'es' : '') + '!<br>'
        + nm(S.pickerIdx) + ' scores <span class="zero">+0 pts</span>');
      updateInfo();
      return;
    }

    if (fb === 'up') {
      for (let i = S.lo; i <= S.currentGuess; i++) {
        setCellClass(i, (i === S.currentGuess) ? 'guessed' : 'eliminated');
      }
      S.lo = S.currentGuess + 1;
      addLog('#' + S.chancesUsed + ': ' + S.currentGuess + ' → Higher');
    } else {
      for (let i = S.currentGuess; i <= S.hi; i++) {
        setCellClass(i, (i === S.currentGuess) ? 'guessed' : 'eliminated');
      }
      S.hi = S.currentGuess - 1;
      addLog('#' + S.chancesUsed + ': ' + S.currentGuess + ' → Lower');
    }

    S.currentGuess = null;
    setFbActive(false);
    updateInfo();

    if (S.chancesUsed >= S.maxChances) {
      addLog('Out of chances!');
      showReveal();
      return;
    }

    prompt.textContent = nm(S.guesserIdx) + ': Tap a number to guess';
    save();
  }

  function nextRound() {
    S.round++;
    S.pickerIdx = S.pickerIdx === 0 ? 1 : 0;
    S.guesserIdx = S.guesserIdx === 0 ? 1 : 0;
    S.chancesUsed = 0; S.lo = 1; S.hi = 100;
    S.currentGuess = null; S.gameOver = false; S.roundOver = false;
    S.guesses = [];
    S.cells = Array(100).fill('eligible');
    log.innerHTML = '';
    setFbActive(false);
    document.getElementById('revealBar').classList.add('hidden');
    document.getElementById('pointsDisplay').classList.add('hidden');
    document.getElementById('nextRoundBtn').classList.add('hidden');
    document.getElementById('revealInput').value = '';
    prompt.textContent = nm(S.guesserIdx) + ': Tap a number to guess';
    updateScoreboard();
    buildGrid();
    updateInfo();
    save();
  }

  function resetGame() {
    S = {
      maxChances: S.maxChances, chancesUsed: 0, lo: 1, hi: 100,
      currentGuess: null, gameOver: false, guesses: [], roundOver: false,
      scores: [0, 0], round: 1, pickerIdx: 0, guesserIdx: 1,
      history: [],
      names: [document.getElementById('p1name').value, document.getElementById('p2name').value],
      cells: Array(100).fill('eligible')
    };
    log.innerHTML = '';
    setFbActive(false);
    document.getElementById('revealBar').classList.add('hidden');
    document.getElementById('pointsDisplay').classList.add('hidden');
    document.getElementById('nextRoundBtn').classList.add('hidden');
    document.getElementById('revealInput').value = '';
    prompt.textContent = nm(S.guesserIdx) + ': Tap a number to guess';
    updateScoreboard();
    renderHistory();
    buildGrid();
    updateInfo();
    save();
  }

  function restore() {
    load();
    document.getElementById('p1name').value = S.names[0];
    document.getElementById('p2name').value = S.names[1];
    updateScoreboard();
    renderHistory();
    buildGrid();
    updateInfo();

    if (S.currentGuess) setFbActive(true);
    else setFbActive(false);

    if (S.roundOver) {
      prompt.textContent = 'Round over! Press Next Round.';
      document.getElementById('nextRoundBtn').classList.remove('hidden');
    } else if (S.gameOver && S.chancesUsed >= S.maxChances) {
      document.getElementById('revealBar').classList.remove('hidden');
      prompt.textContent = nm(S.pickerIdx) + ': Enter the correct number';
    } else {
      prompt.textContent = nm(S.guesserIdx) + ': Tap a number to guess';
    }
  }

  document.getElementById('revealInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') revealAnswer();
  });

  ['p1name', 'p2name'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      S.names = [document.getElementById('p1name').value, document.getElementById('p2name').value];
      renderHistory();
      save();
    });
  });

  restore();

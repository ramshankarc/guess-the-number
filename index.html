<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guess the Number — 2-Player Number Guessing Game</title>
<meta name="description" content="A fun 2-player number guessing game (1–100). One player picks, the other guesses with limited chances. Track scores, see distance highlights. No install needed — plays in your browser.">
<meta name="theme-color" content="#1a1a2e">
<meta property="og:title" content="Guess the Number — 2-Player Game">
<meta property="og:description" content="Pick a number, guess it right! A fast 2-player guessing game with score tracking. Runs entirely in your browser.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Guess the Number — 2-Player Game">
<meta name="twitter:description" content="Pick a number, guess it right! A fast 2-player guessing game with score tracking.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 4px 10px; }

  .header {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 4px;
  }
  .player {
    flex: 0 1 40%; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 8px; border-radius: 8px; background: #16213e;
    transition: background 0.2s, outline-color 0.2s;
    outline: 2px solid transparent;
  }
  .player.active { background: #0f3460; outline: 2px solid #ffd166; }
  .player .name-input {
    background: transparent; border: none; border-bottom: 1px solid #444;
    color: #667; font-size: 1.35rem; text-align: center; flex: 1; min-width: 0; outline: none;
    font-weight: 700; transition: color 0.2s;
  }
  .player.active .name-input { color: #ffd166; }
  .score-badge {
    background: #ffd166; color: #1a1a2e; font-size: 1.2rem; font-weight: 900;
    border-radius: 6px; padding: 3px 10px; min-width: 32px; text-align: center;
  }
  .header .info {
    font-size: 0.95rem; color: #99a; white-space: nowrap; flex-shrink: 0;
  }
  .header .info span { font-weight: 800; color: #fff; }

  .prompt {
    text-align: center; margin-bottom: 2px; font-size: 1.15rem; color: #bbc; height: 1.5em;
    font-weight: 600; overflow: hidden;
  }

  .game-area {
    display: flex; gap: 10px; max-width: 900px; margin: 0 auto;
    align-items: flex-start; justify-content: center;
  }

  .grid-col { flex: 1; min-width: 0; max-width: 560px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    width: 100%;
  }
  .cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    font-size: clamp(1rem, 2.5vw, 1.5rem); font-weight: 800;
    transition: background 0.15s, color 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cell.eligible { background: #0f3460; color: #e0e0ff; cursor: pointer; }
  @media (hover: hover) { .cell.eligible:hover { background: #1a5276; } }
  .cell.selected { background: #ffd166; color: #1a1a2e; cursor: pointer; }
  .cell.eliminated { background: #2a2a3a; color: #555; }
  .cell.guessed { background: #9b2226; color: #888; }
  .cell.correct { background: #2d6a4f; color: #fff; animation: pulse 0.6s ease 2; }
  .cell.answer { background: #2d6a4f; color: #fff; }
  .cell.distance { background: #e76f51; color: #fff; }
  .cell.closest { background: #f4a261; color: #1a1a2e; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .score-col { width: 190px; flex-shrink: 0; margin-top: 3.4rem; }
  .sidebar-title {
    font-size: 0.75rem; color: #99a; text-transform: uppercase; letter-spacing: 1.5px;
    margin-bottom: 4px; text-align: center; font-weight: 700;
  }
  #resetBtn {
    background: none; border: none; color: #99a; cursor: pointer;
    font-size: 1rem; padding: 0 2px; vertical-align: middle; transition: color 0.2s;
  }
  #resetBtn:hover { color: #ddd; }
  #resetBtn.confirm { color: #e63946; }
  .score-table {
    width: 100%; border-collapse: collapse; font-size: 0.85rem;
    background: #16213e; border-radius: 8px; overflow: hidden;
  }
  .score-table th {
    padding: 5px 3px; background: #0f3460; color: #bbc;
    font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .score-table td {
    padding: 4px 3px; text-align: center; border-bottom: 1px solid #1a1a2e; color: #dde;
  }
  .score-table tr:last-child td { border-bottom: none; }
  .score-table .rn { color: #889; font-weight: 600; }
  .score-table .pts-cell { font-weight: 800; font-size: 0.95rem; }
  .no-rounds { text-align: center; color: #667; font-size: 0.85rem; padding: 14px 0; }

  .bottombar {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    flex-wrap: wrap; margin-top: 6px;
  }
  .bottombar label { font-size: 0.9rem; color: #aab; }
  .bottombar input[type="number"] {
    width: 44px; padding: 4px; border-radius: 6px; border: 1px solid #444;
    background: #16213e; color: #eee; font-size: 1rem; text-align: center;
  }
  .toggle-wrap {
    display: flex; align-items: center; gap: 6px;
  }
  .toggle-wrap label { font-size: 0.9rem; color: #aab; cursor: pointer; }
  .toggle {
    position: relative; width: 40px; height: 22px; cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute; inset: 0; background: #333; border-radius: 22px;
    transition: background 0.2s;
  }
  .toggle .slider::before {
    content: ''; position: absolute; left: 3px; top: 3px;
    width: 16px; height: 16px; border-radius: 50%; background: #888;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider { background: #2d6a4f; }
  .toggle input:checked + .slider::before { transform: translateX(18px); background: #fff; }
  .bottombar button {
    padding: 12px 28px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 1.2rem; font-weight: 700;
  }
  .bottombar button:active { transform: scale(0.96); }
  .bottombar button:hover { filter: brightness(1.15); }
  #passBtn { background: #2d6a4f; color: #fff; }
  #repickBtn { background: #e76f51; color: #fff; }
  #nextRoundBtn { background: #2d6a4f; color: #fff; font-size: 1.4rem; padding: 14px 36px; }

  .log {
    max-width: 640px; margin: 4px auto 0;
    background: #16213e; border-radius: 8px; padding: 4px 10px;
    font-size: 0.8rem; max-height: 50px; overflow-y: auto;
  }
  .log p { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
  .log p:last-child { border: none; }

  .cell.picked { background: #ffd166; color: #1a1a2e; cursor: default; }

  .hidden { display: none !important; }

  /* iPad landscape */
  @media (min-width: 700px) and (min-height: 600px) {
    .cell { font-size: clamp(1.1rem, 2vw, 1.6rem); }
    .grid { gap: 4px; }
  }

  /* Phone portrait */
  @media (max-width: 700px) {
    .game-area { flex-direction: column; align-items: center; }
    .score-col { width: 100%; max-width: 520px; }
    .cell { font-size: clamp(0.85rem, 4vw, 1.2rem); }
  }
</style>
</head>
<body>

<div class="game-area">
  <div class="grid-col">
    <div class="header">
      <div class="player active" id="p1box">
        <input class="name-input" id="p1name" value="Player 1" maxlength="12">
        <span class="score-badge" id="p1score">0</span>
      </div>
      <div class="info">
        <span id="chancesLeft">5</span> left
      </div>
      <div class="player" id="p2box">
        <input class="name-input" id="p2name" value="Player 2" maxlength="12">
        <span class="score-badge" id="p2score">0</span>
      </div>
    </div>
    <div class="prompt" id="prompt">Player 1: Tap your secret number</div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="score-col">
    <div class="sidebar-title">Score History <button id="resetBtn" onclick="resetGame()" title="Reset game">&#x21BA;</button></div>
    <div id="scoreHistory"><div class="no-rounds">No rounds yet</div></div>
  </div>
</div>

<div class="bottombar">
  <div class="toggle-wrap">
    <label for="autoToggle">Auto</label>
    <label class="toggle"><input type="checkbox" id="autoToggle" onchange="toggleAutoMode()"><span class="slider"></span></label>
  </div>
  <label>Chances:</label>
  <input type="number" id="chancesInput" min="1" max="20" value="5" onchange="updateChances()">
  <button id="passBtn" class="hidden" onclick="skipCountdown()">Pass</button>
  <button id="repickBtn" class="hidden" onclick="undoPick()">Re-pick</button>
  <button id="nextRoundBtn" class="hidden" onclick="nextRound()">Next Round &#x27A1;</button>
</div>

<div class="log" id="log"></div>


<script>
  const KEY = 'guess_the_number_state';
  const GUESS_BONUS = [10, 5, 2, 1, 0];

  let S = {
    maxChances: 5, chancesUsed: 0, lo: 1, hi: 100,
    gameOver: false, guesses: [], roundOver: false,
    secretNumber: null, phase: 'pick',
    scores: [0, 0], round: 1, pickerIdx: 0, guesserIdx: 1,
    history: [], names: ['Player 1', 'Player 2'],
    cells: Array(100).fill('eligible'),
    autoMode: false
  };

  const grid = document.getElementById('grid');
  const log = document.getElementById('log');
  const promptEl = document.getElementById('prompt');

  function nm(i) { return S.names[i]; }

  function guessBonus(guessNum) {
    return guessNum <= GUESS_BONUS.length ? GUESS_BONUS[guessNum - 1] : 0;
  }

  function save() {
    S.names = [document.getElementById('p1name').value, document.getElementById('p2name').value];
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  }

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.scores) S = d;
    } catch(e) {}
  }

  function setActivePlayer(idx) {
    document.getElementById('p1box').className = 'player' + (idx === 0 ? ' active' : '');
    document.getElementById('p2box').className = 'player' + (idx === 1 ? ' active' : '');
  }

  function updateScoreboard() {
    if (S.phase === 'pick' || S.phase === 'picking') setActivePlayer(S.pickerIdx);
    else setActivePlayer(S.guesserIdx);
  }

  function updateScoreBadges() {
    document.getElementById('p1score').textContent = S.scores[0];
    document.getElementById('p2score').textContent = S.scores[1];
  }

  function renderHistory() {
    updateScoreBadges();
    const el = document.getElementById('scoreHistory');
    if (!S.history.length) { el.innerHTML = '<div class="no-rounds">No rounds yet</div>'; return; }
    let h = '<table class="score-table"><thead><tr><th>R</th><th>' + nm(0) + '</th><th>' + nm(1) + '</th></tr></thead><tbody>';
    for (const r of S.history) {
      const p1pts = r.p1pts || 0;
      const p2pts = r.p2pts || 0;
      h += '<tr><td class="rn">' + r.round + '</td>'
        + '<td class="pts-cell">' + (p1pts ? '<span style="color:#e76f51">+' + p1pts + '</span>' : '<span style="color:#4a9">0</span>') + '</td>'
        + '<td class="pts-cell">' + (p2pts ? '<span style="color:#e76f51">+' + p2pts + '</span>' : '<span style="color:#4a9">0</span>') + '</td></tr>';
    }
    h += '</tbody></table>';
    el.innerHTML = h;
  }

  function buildGrid() {
    grid.innerHTML = '';
    for (let i = 1; i <= 100; i++) {
      const d = document.createElement('div');
      d.className = 'cell ' + S.cells[i - 1];
      d.textContent = i;
      d.id = 'c' + i;
      d.onclick = () => cellClick(i);
      grid.appendChild(d);
    }
  }

  function setCellClass(i, cls) {
    S.cells[i - 1] = cls;
    document.getElementById('c' + i).className = 'cell ' + cls;
  }

  let _pickTimer = null;

  function cellClick(num) {
    if (S.roundOver || S.gameOver) return;
    if (S.phase === 'picking') return;

    if (S.phase === 'pick') {
      if (S.autoMode) return;
      pickSecret(num);
      return;
    }

    if (S.phase === 'guess') {
      if (S.cells[num - 1] !== 'eligible' || S._evaluating) return;
      makeGuess(num);
    }
  }

  function pickSecret(num) {
    S.secretNumber = num;
    S.phase = 'picking';
    setCellClass(num, 'picked');
    document.getElementById('repickBtn').classList.remove('hidden');
    document.getElementById('passBtn').classList.remove('hidden');
    promptEl.textContent = num + ' selected! Pass to ' + nm(S.guesserIdx) + '...';
    save();
    let countdown = 5;
    _pickTimer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        promptEl.textContent = num + ' selected! Pass to ' + nm(S.guesserIdx) + '... ' + countdown;
      } else {
        clearInterval(_pickTimer);
        _pickTimer = null;
        setCellClass(num, 'eligible');
        S.phase = 'guess';
        document.getElementById('passBtn').classList.add('hidden');
        setActivePlayer(S.guesserIdx);
        promptEl.textContent = nm(S.guesserIdx) + ': Guess the number';
        save();
      }
    }, 1000);
  }

  function skipCountdown() {
    if (_pickTimer) { clearInterval(_pickTimer); _pickTimer = null; }
    if (S.secretNumber) setCellClass(S.secretNumber, 'eligible');
    S.phase = 'guess';
    document.getElementById('passBtn').classList.add('hidden');
    setActivePlayer(S.guesserIdx);
    promptEl.textContent = nm(S.guesserIdx) + ': Guess the number';
    save();
  }

  function undoPick() {
    if (_pickTimer) { clearInterval(_pickTimer); _pickTimer = null; }
    S.secretNumber = null;
    S.phase = 'pick';
    S.cells = Array(100).fill('eligible');
    S.lo = 1; S.hi = 100;
    buildGrid();
    document.getElementById('repickBtn').classList.add('hidden');
    document.getElementById('passBtn').classList.add('hidden');
    setActivePlayer(S.pickerIdx);
    promptEl.textContent = nm(S.pickerIdx) + ': Tap your secret number';
    save();
  }

  function makeGuess(num) {
    if (S.chancesUsed === 0) document.getElementById('repickBtn').classList.add('hidden');
    S._evaluating = true;
    setCellClass(num, 'selected');
    S.chancesUsed++;
    S.guesses.push(num);
    setTimeout(() => { S._evaluating = false; evaluateGuess(num); }, 300);
  }

  function evaluateGuess(num) {
    if (num === S.secretNumber) {
      setCellClass(num, 'correct');
      for (let i = 1; i <= 100; i++) {
        if (i !== num && S.cells[i - 1] === 'eligible') setCellClass(i, 'eliminated');
      }
      const bonus = guessBonus(S.chancesUsed);
      addLog('R' + S.round + ': ' + num + ' Correct! ' + nm(S.guesserIdx) + ' +' + bonus + ' ' + nm(S.pickerIdx) + ' +0');
      endRound(0, bonus);
      updateInfo();
      return;
    }

    if (num < S.secretNumber) {
      for (let i = S.lo; i <= num; i++) {
        setCellClass(i, (i === num) ? 'guessed' : 'eliminated');
      }
      S.lo = num + 1;
      addLog('#' + S.chancesUsed + ': ' + num);
    } else {
      for (let i = num; i <= S.hi; i++) {
        setCellClass(i, (i === num) ? 'guessed' : 'eliminated');
      }
      S.hi = num - 1;
      addLog('#' + S.chancesUsed + ': ' + num);
    }

    updateInfo();

    if (S.chancesUsed >= S.maxChances) {
      const lastGuess = S.guesses[S.guesses.length - 1];
      const dist = highlightDistance(lastGuess, S.secretNumber);
      addLog('R' + S.round + ': Answer=' + S.secretNumber + ' Dist=' + dist + ' → ' + nm(S.pickerIdx) + ' +' + dist);
      endRound(dist, 0);
      updateInfo();
      return;
    }

    promptEl.textContent = nm(S.guesserIdx) + ': Guess the number';
    save();
  }

  function toggleAutoMode() {
    S.autoMode = document.getElementById('autoToggle').checked;
    if (S.autoMode && S.phase === 'pick') {
      autoPickSecret();
    } else if (!S.autoMode && S.phase === 'guess' && S.chancesUsed === 0) {
      S.secretNumber = null;
      S.phase = 'pick';
      setActivePlayer(S.pickerIdx);
      promptEl.textContent = nm(S.pickerIdx) + ': Tap your secret number';
    }
    save();
  }

  function autoPickSecret() {
    S.secretNumber = Math.floor(Math.random() * 100) + 1;
    S.phase = 'guess';
    setActivePlayer(S.guesserIdx);
    promptEl.textContent = nm(S.guesserIdx) + ': Guess the number';
    document.getElementById('repickBtn').classList.add('hidden');
    document.getElementById('passBtn').classList.add('hidden');
    save();
  }

  function updateChances() {
    S.maxChances = Math.max(1, Math.min(20, +document.getElementById('chancesInput').value || 5));
    save();
  }

  function updateInfo() {
    document.getElementById('chancesLeft').textContent = S.maxChances - S.chancesUsed;
    document.getElementById('chancesInput').value = S.maxChances;
  }

  function addLog(msg) {
    const p = document.createElement('p');
    p.textContent = msg;
    log.prepend(p);
  }

  function highlightDistance(lastGuess, answer) {
    const dist = Math.abs(lastGuess - answer);
    const from = Math.min(lastGuess, answer);
    const to = Math.max(lastGuess, answer);
    for (let i = from; i <= to; i++) {
      if (i === answer) setCellClass(i, 'answer');
      else if (i === lastGuess) setCellClass(i, 'closest');
      else setCellClass(i, 'distance');
    }
    return dist;
  }

  function endRound(pickerPts, guesserPts) {
    S.scores[S.pickerIdx] += pickerPts;
    S.scores[S.guesserIdx] += guesserPts;
    const p1pts = (S.pickerIdx === 0 ? pickerPts : guesserPts);
    const p2pts = (S.pickerIdx === 1 ? pickerPts : guesserPts);
    S.history.push({ round: S.round, pickerIdx: S.pickerIdx, p1pts: p1pts, p2pts: p2pts });
    S.roundOver = true;
    S.gameOver = true;
    updateScoreboard();
    renderHistory();
    promptEl.textContent = 'Round over — tap Next Round';
    document.getElementById('nextRoundBtn').classList.remove('hidden');
    save();
  }

  function nextRound() {
    S.round++;
    S.pickerIdx = S.pickerIdx === 0 ? 1 : 0;
    S.guesserIdx = S.guesserIdx === 0 ? 1 : 0;
    S.chancesUsed = 0; S.lo = 1; S.hi = 100;
    S.gameOver = false; S.roundOver = false;
    S.secretNumber = null; S.phase = 'pick';
    S.guesses = [];
    S.cells = Array(100).fill('eligible');
    log.innerHTML = '';
    document.getElementById('nextRoundBtn').classList.add('hidden');
    updateScoreboard();
    buildGrid();
    updateInfo();
    if (S.autoMode) {
      autoPickSecret();
    } else {
      promptEl.textContent = nm(S.pickerIdx) + ': Tap your secret number';
    }
    save();
  }

  let _resetTimer = null;
  function resetGame() {
    const btn = document.getElementById('resetBtn');
    if (!btn.classList.contains('confirm')) {
      btn.classList.add('confirm');
      btn.innerHTML = '&#x2715;';
      _resetTimer = setTimeout(() => { btn.classList.remove('confirm'); btn.innerHTML = '&#x21BA;'; }, 3000);
      return;
    }
    if (_resetTimer) { clearTimeout(_resetTimer); _resetTimer = null; }
    btn.classList.remove('confirm');
    btn.textContent = '↺';
    S = {
      maxChances: S.maxChances, chancesUsed: 0, lo: 1, hi: 100,
      gameOver: false, guesses: [], roundOver: false,
      secretNumber: null, phase: 'pick',
      scores: [0, 0], round: 1, pickerIdx: 0, guesserIdx: 1,
      history: [],
      names: [document.getElementById('p1name').value, document.getElementById('p2name').value],
      cells: Array(100).fill('eligible'),
      autoMode: document.getElementById('autoToggle').checked
    };
    log.innerHTML = '';
    document.getElementById('nextRoundBtn').classList.add('hidden');
    updateScoreboard();
    renderHistory();
    buildGrid();
    updateInfo();
    if (S.autoMode) {
      autoPickSecret();
    } else {
      promptEl.textContent = nm(S.pickerIdx) + ': Tap your secret number';
    }
    save();
  }

  function restore() {
    load();
    document.getElementById('p1name').value = S.names[0];
    document.getElementById('p2name').value = S.names[1];
    document.getElementById('autoToggle').checked = !!S.autoMode;
    updateScoreboard();
    renderHistory();
    buildGrid();
    updateInfo();

    if (S.roundOver) {
      promptEl.textContent = 'Round over! Press Next Round.';
      document.getElementById('nextRoundBtn').classList.remove('hidden');
    } else if (S.phase === 'pick' || S.phase === 'picking') {
      S.phase = 'pick';
      S.secretNumber = null;
      S.cells = Array(100).fill('eligible');
      buildGrid();
      if (S.autoMode) {
        autoPickSecret();
      } else {
        promptEl.textContent = nm(S.pickerIdx) + ': Tap your secret number';
      }
    } else if (S.phase === 'guess' && !S.gameOver) {
      promptEl.textContent = nm(S.guesserIdx) + ': Guess the number';
      if (S.chancesUsed === 0 && !S.autoMode) document.getElementById('repickBtn').classList.remove('hidden');
    }
  }

  ['p1name', 'p2name'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      S.names = [document.getElementById('p1name').value, document.getElementById('p2name').value];
      renderHistory();
      save();
    });
  });

  restore();
</script>
</body>
</html>
